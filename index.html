<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DSA-based route navigation (Dijkstra, A*, BFS, DFS) visualized in 3D over a real-world EPCOT dataset — an academic demonstration, not for real-world navigation."
    />
    <title>Campus Route Navigation — EPCOT (DSA Engine)</title>
    <style>
      /* Inline boot styles so the loading state renders before the bundle. */
      html, body { margin: 0; height: 100%; background: #0c1220; }
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; font-family: "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        color: #dbe4f0; transition: opacity 0.45s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .boot-brand { font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
      #boot .boot-sub { font-size: 14px; color: #8ea0bd; margin-top: -10px; }
      #boot .boot-steps { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; min-width: 260px; }
      #boot .boot-step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #64768f; transition: color 0.25s; }
      #boot .boot-step .dot { width: 8px; height: 8px; border-radius: 50%; background: #24344f; transition: background 0.25s; flex: none; }
      #boot .boot-step.active { color: #dbe4f0; }
      #boot .boot-step.active .dot { background: #f5b942; }
      #boot .boot-step.ok { color: #8ea0bd; }
      #boot .boot-step.ok .dot { background: #4cc38a; }
    </style>
  </head>
  <body>
    <div id="boot" aria-live="polite">
      <div class="boot-brand">SMART CAMPUS ROUTE</div>
      <div class="boot-sub">Navigation Intelligence</div>
      <div class="boot-steps">
        <div class="boot-step" data-step="map"><span class="dot"></span>Loading map…</div>
        <div class="boot-step" data-step="locations"><span class="dot"></span>Loading locations…</div>
        <div class="boot-step" data-step="graph"><span class="dot"></span>Preparing navigation graph…</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
